[project]
name = "astrolab"
version = "0.1.0.dev0"
description = "Reproducible, provenance-tracked analysis of space-based observatory and sky-survey data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "astropy>=6.1",
    "numpy>=1.26",
    "astroquery>=0.4.7",
    "lightkurve>=2.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "structlog>=24.1",
    "pooch>=1.8",
    "pyarrow>=16.0",
    # -- Phase 2: transit photometry -------------------------------------------------
    "wotan>=1.10",              # transit-preserving detrending (search stage, ADR-0003)
    "transitleastsquares>=1.32",  # limb-darkened template search; see maintenance note in ADR-0005
    "batman-package>=2.5",      # Mandel-Agol forward model
    "dynesty>=2.1",             # nested sampling: posteriors AND evidence for model comparison
    "matplotlib>=3.8",          # figures for the report
    # batman imports distutils, removed from the stdlib in Python 3.12. setuptools still
    # vendors a shim, so this is a load-bearing dependency, not incidental tooling. See
    # ADR-0005: setuptools intends to drop it, and batman will need patching or replacing
    # (PyTransit) when that happens.
    "setuptools>=69",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "pytest-regressions>=2.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
astrolab = "astrolab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astrolab"]

[tool.hatch.build.targets.wheel.force-include]
"src/astrolab/validation/data" = "astrolab/validation/data"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # typer uses function calls in argument defaults by design

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/astrolab/core", "src/astrolab/archives"]

[[tool.mypy.overrides]]
# These ship without type stubs. Untyped imports are allowed at the boundary;
# our own wrappers around them are typed.
module = ["astropy.*", "astroquery.*", "lightkurve.*", "pooch.*", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: requires live archive access; deselected by default (see docs/design.md)",
    "slow: full periodogram searches; run in CI but skippable locally with -m 'not slow'",
]

[tool.coverage.run]
source = ["src/astrolab"]
