[project]
name = "astrolab"
version = "0.1.0.dev0"
description = "Reproducible, provenance-tracked analysis of space-based observatory and sky-survey data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "astropy>=6.1",
    "numpy>=1.26",
    "astroquery>=0.4.7",
    "lightkurve>=2.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "structlog>=24.1",
    "pooch>=1.8",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "pytest-regressions>=2.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
astrolab = "astrolab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astrolab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # typer uses function calls in argument defaults by design

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/astrolab/core", "src/astrolab/archives"]

[[tool.mypy.overrides]]
# These ship without type stubs. Untyped imports are allowed at the boundary;
# our own wrappers around them are typed.
module = ["astropy.*", "astroquery.*", "lightkurve.*", "pooch.*", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: requires live archive access; deselected by default (see docs/design.md)",
]

[tool.coverage.run]
source = ["src/astrolab"]
